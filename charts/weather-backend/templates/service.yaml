apiVersion: v1
kind: Service
metadata:
  name: weather-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: weather-backend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: weather-backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP